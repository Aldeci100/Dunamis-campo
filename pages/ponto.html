<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponto — Dunamis Services</title>
<link rel="stylesheet" href="../css/style.css?v=2">
</head>
<body>

<div class="tela">
  <div class="topo">
    <a href="dashboard.html" class="voltar">‹ Painel</a>
    <h1>Ponto</h1>
    <span style="width:50px;"></span>
  </div>

  <div id="blocoSelecao">
    <label>Funcionário</label>
    <select id="pontoFuncionario"></select>

    <label>Obra</label>
    <select id="pontoObra"></select>
  </div>

  <div id="blocoIdentidade" class="ponto-status" style="display:none;padding:16px;text-align:left;">
    <div class="sub">Funcionário</div>
    <div class="nome" id="pontoIdentidadeNome" style="font-size:20px;font-weight:700;"></div>
    <div class="sub" id="pontoIdentidadeObra" style="margin-top:6px;"></div>
  </div>

  <div class="ponto-status" style="margin-top:20px;">
    <div class="sub" id="pontoUltimoRegistro">Nenhum registro hoje</div>
    <div class="grande" id="pontoHoraAtual">--:--</div>
    <input type="text" id="pontoPin" maxlength="4" inputmode="numeric" placeholder="Seu PIN" style="margin-top:14px;text-align:center;letter-spacing:4px;">
    <button id="btnBaterPonto" class="btn-ponto btn-entrada" disabled>Marcar entrada</button>
    <div class="geo-info" id="pontoGeoInfo">Selecione o funcionário e a obra para começar.</div>
  </div>

  <label style="margin-top:24px;">Registros de hoje</label>
  <div id="listaPontosHoje" class="lista"></div>

  <button type="button" class="btn-secundaria" id="btnTrocarSenha" style="display:none;margin-top:24px;">🔑 Trocar minha senha</button>
  <button type="button" class="btn-secundaria" id="btnSairPonto" style="display:none;margin-top:10px;" onclick="sair()">Sair</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../js/firebase-init.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/permissoes.js"></script>
<script src="../js/dados.js"></script>
<script src="../js/modules/ponto.js?v=5"></script>
</body>
</html>
