<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dunamis Services</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<meta name="theme-color" content="#1e40af">
<style>
  /* Tela de login tem visual próprio (claro), diferente do resto do
     app (dark) — por isso não usa css/style.css, fica isolada aqui. */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #3b82f6 0%, #1e3a8a 100%);
    padding: 20px;
  }

  .cartao-login {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    padding: 36px 32px 28px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .icone-login {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    background: linear-gradient(135deg, #3b82f6, #1e3a8a);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 32px;
  }

  .cartao-login h1 {
    font-size: 22px;
    color: #111827;
    margin: 0 0 4px;
  }

  .cartao-login .subtitulo {
    color: #6b7280;
    font-size: 13px;
    margin: 0 0 24px;
  }

  .campo {
    text-align: left;
    margin-bottom: 16px;
  }

  .campo label {
    display: block;
    font-size: 13px;
    color: #374151;
    margin-bottom: 6px;
  }

  .campo input {
    width: 100%;
    padding: 12px 14px;
    background: #eef1f7;
    border: 1px solid #e2e6ee;
    border-radius: 8px;
    font-size: 15px;
    color: #111827;
  }

  .campo input:focus {
    outline: none;
    border-color: #3b82f6;
    background: #fff;
  }

  .campo-senha {
    position: relative;
  }

  .campo-senha input {
    padding-right: 44px;
  }

  .btn-olho {
    position: absolute;
    right: 6px;
    top: 6px;
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #6b7280;
    border-radius: 6px;
  }

  .btn-olho:hover {
    background: #e2e6ee;
  }

  .btn-entrar {
    width: 100%;
    padding: 13px;
    margin-top: 6px;
    background: linear-gradient(135deg, #3b82f6, #1e40af);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-entrar:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .rodape-login {
    margin-top: 20px;
    font-size: 12px;
    color: #9ca3af;
  }

  .aviso-modo {
    margin-top: 16px;
    font-size: 12px;
    color: #b45309;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    padding: 10px 12px;
    text-align: left;
    display: none;
  }
</style>
</head>
<body>

<div class="cartao-login">
  <div class="icone-login">🏗️</div>
  <h1>DUNAMIS SERVICES</h1>
  <p class="subtitulo">Sistema de Gestão de Obras e Campo</p>

  <form id="formLogin">
    <div class="campo">
      <label>E-mail</label>
      <input type="email" id="loginEmail" placeholder="seu@email.com" required>
    </div>

    <div class="campo campo-senha">
      <label>Senha</label>
      <input type="password" id="loginSenha" placeholder="••••••••" required>
      <button type="button" class="btn-olho" id="btnOlho" aria-label="Mostrar senha">👁️</button>
    </div>

    <button type="submit" class="btn-entrar btnLogin">ENTRAR</button>
  </form>

  <p class="aviso-modo" id="avisoModo"></p>
  <p class="rodape-login">Dunamis Services © 2026</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/login.js"></script>
</body>
</html>
